version: "3.9"

services:
  # ── Postgres — evidence store ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc2secret}
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc2} -d ${POSTGRES_DB:-compliance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis — event bus (Streams) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: soc2_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant — vector DB for SOC 2 RAG ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: soc2_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — webhook server + agent entrypoint ────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc2_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soc2}:${POSTGRES_PASSWORD:-soc2secret}@postgres:5432/${POSTGRES_DB:-compliance}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # live-reload during development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      uvicorn api.webhooks:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
