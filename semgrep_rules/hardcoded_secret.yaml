# semgrep_rules/hardcoded_secret.yaml
rules:
  - id: hardcoded-secret-assignment
    languages: [python]
    severity: ERROR
    message: >-
      A secret value appears to be hardcoded. SOC 2 CC6.1 requires secrets
      to be stored outside source code (env vars, secret manager).
    metadata:
      soc2_control: CC6.1
      soc2_control_name: Logical and physical access controls
      severity: HIGH
    patterns:
      - pattern-either:
          - pattern: password = "..."
          - pattern: api_key = "..."
          - pattern: secret = "..."
          - pattern: token = "..."
